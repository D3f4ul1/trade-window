# ---------------------------------------------------------------------------
# Gradle / JVM
# ---------------------------------------------------------------------------
# Loom holds two Minecraft toolchains in memory; 1G (the example-mod default)
# is not enough when both version modules are configured in one build.
org.gradle.jvmargs=-Xmx4G
# Sequential by default: running two Loom configurations in parallel doubles
# peak heap for no meaningful wall-clock win on a normal dev box.
org.gradle.parallel=false
org.gradle.configuration-cache=false
# With 15 version modules in one build, a bare `gradle :v1_21_6:build` would
# otherwise configure and resolve all fifteen Minecraft toolchains. On demand
# configuration touches only the projects actually asked for, which keeps a
# single-target build to a single download.
org.gradle.configureondemand=true

# ---------------------------------------------------------------------------
# Java toolchains
# ---------------------------------------------------------------------------
# The 26.3 module compiles with `options.release = 25`, so a JDK 25 must be
# visible to Gradle. Gradle only auto-detects JDKs in the usual install
# locations, so point this at yours. Multiple entries are separated by ','.
# On Windows use forward slashes; on macOS/Linux use the real path.
#
#   Windows : C:/Program Files/Eclipse Adoptium/jdk-25.0.4.1+1
#   macOS   : /Library/Java/JavaVirtualMachines/temurin-25.jdk/Contents/Home
#   Linux   : /usr/lib/jvm/temurin-25-jdk
#
org.gradle.java.installations.paths=C:/Users/N0th1ng/.workbuddy-ai/binaries/java/jdk-25.0.4.1+1

# ---------------------------------------------------------------------------
# Fabric — version-agnostic tooling
# ---------------------------------------------------------------------------
# Loom 1.17.x drives BOTH targets. Note the plugin id is not stable across
# eras: 1.20.1-style obfuscated targets use `net.fabricmc.fabric-loom-remap`,
# unobfuscated targets (26.1+) use `net.fabricmc.fabric-loom`.
loom_version=1.17.21

# ---------------------------------------------------------------------------
# Mod metadata
# ---------------------------------------------------------------------------
# Per-target coordinates — Minecraft version, Fabric API build, Java level and
# loader — are deliberately NOT here. They live in gradle/versions.gradle, which
# is the single source of truth for all fifteen targets. (Earlier revisions also
# repeated them here for 1.20.1 and 26.3 only; those copies were never read by
# the build and have been removed rather than left to drift.)
mod_version=1.4.3
mod_group=com.tradewindow
