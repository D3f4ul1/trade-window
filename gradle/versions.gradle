// ---------------------------------------------------------------------------
// The build matrix — the single source of truth for every target.
//
// Each entry describes one Minecraft version the mod ships for. Everything a
// version module needs is derived from its entry, so adding a target is one line
// here plus a directory containing a three-line build.gradle and a
// fabric.mod.json.
//
//   mc      the Minecraft version
//   era     which source tree under eras/ this target compiles
//   java    the Java release level the game requires
//   api     the Fabric API build for that Minecraft version
//   loader  the Fabric Loader version we BUILD against. This is also the
//           minimum declared in fabric.mod.json, so it is deliberately the
//           oldest version we support rather than the newest: building against
//           the oldest proves the mod works there, and newer loaders satisfy
//           the ">=" constraint automatically. Supported: 0.19.3, 0.19.4,
//           0.19.5 and anything later.
//   remap   true for obfuscated targets (needs mappings + remapJar),
//           false for unobfuscated targets (26.1+)
//
// On the `era` field: Minecraft 1.21.1 → 26.3 spans nine distinct API surfaces,
// not thirteen. Targets that share an era share one source tree, so a fix is
// made once and applies to every version in that group.
//
// Every era tree except the reference is generated from eras/1.21.11 by
// tools/port_eras.py, which applies the dialect matrix that script documents.
// Do not hand-edit a non-reference era tree: change the reference or the
// generator and regenerate, so the same fix lands on every target.
//
// The boundaries below were established by reading the real Minecraft jars for
// each version, not assumed — the evidence for each one is in PORTING_NOTES.md.
//
// Fabric API versions are the newest published for each Minecraft version as
// resolved from Modrinth, not the (partly stale) versions quoted in the
// original specification. Those corrections are listed in PORTING_NOTES.md §1.
// ---------------------------------------------------------------------------

ext.tradewindowTargets = [

	// ---- era 1.21: 1.21.1 -------------------------------------------------
	// Chat events still use the constructor form (new ClickEvent.Action...),
	// Entity.getServer() still exists, the held slot is Inventory.getSelected(),
	// and a player head is built with the ResolvableProfile(GameProfile)
	// constructor. 1.21.1 is also the awkward middle of the data-pack rename:
	// the folders are already singular (recipe/, advancement/) but a recipe
	// ingredient is still spelled {"item": "minecraft:x"}.
	'v1_21_1'  : [mc: '1.21.1',  era: '1.21',   java: 21, api: '0.116.17+1.21.1',  loader: '0.19.3', remap: true],

	// ---- era 1.21.2: 1.21.2 – 1.21.4 -------------------------------------
	// Same chat and registration dialect as 1.21.1, but recipe ingredients become
	// the bare string "minecraft:x" — the format every later version keeps.
	'v1_21_2'  : [mc: '1.21.2',  era: '1.21.2', java: 21, api: '0.106.1+1.21.2',   loader: '0.19.3', remap: true],
	'v1_21_3'  : [mc: '1.21.3',  era: '1.21.2', java: 21, api: '0.114.1+1.21.3',   loader: '0.19.3', remap: true],
	'v1_21_4'  : [mc: '1.21.4',  era: '1.21.2', java: 21, api: '0.119.4+1.21.4',   loader: '0.19.3', remap: true],

	// ---- era 1.21.5: 1.21.5 ----------------------------------------------
	// ClickEvent and HoverEvent became sealed records (new ClickEvent.RunCommand,
	// new HoverEvent.ShowText), and Inventory.getSelectedSlot() arrives with the
	// attribute rework.
	'v1_21_5'  : [mc: '1.21.5',  era: '1.21.5', java: 21, api: '0.128.2+1.21.5',   loader: '0.19.3', remap: true],

	// ---- era 1.21.6: 1.21.6 – 1.21.8 ------------------------------------
	// Commands.hasPermission(int) appears here, which is why /tradeadmin's
	// permission gate stops being written as a lambda.
	'v1_21_6'  : [mc: '1.21.6',  era: '1.21.6', java: 21, api: '0.128.2+1.21.6',   loader: '0.19.3', remap: true],
	'v1_21_7'  : [mc: '1.21.7',  era: '1.21.6', java: 21, api: '0.129.0+1.21.7',   loader: '0.19.3', remap: true],
	'v1_21_8'  : [mc: '1.21.8',  era: '1.21.6', java: 21, api: '0.136.1+1.21.8',   loader: '0.19.3', remap: true],

	// ---- era 1.21.9: 1.21.9 – 1.21.10 -----------------------------------
	// Entity.getServer() is gone (the lookup becomes level().getServer()) and
	// ResolvableProfile.createResolved() appears. Player.playNotifySound() is
	// still there.
	'v1_21_9'  : [mc: '1.21.9',  era: '1.21.9', java: 21, api: '0.134.1+1.21.9',   loader: '0.19.3', remap: true],
	'v1_21_10' : [mc: '1.21.10', era: '1.21.9', java: 21, api: '0.138.4+1.21.10',  loader: '0.19.3', remap: true],

	// ---- era 1.21.11: 1.21.11 — THE REFERENCE ---------------------------
	// Still obfuscated, but Mojang's mappings for this version already use the
	// post-rename names: ResourceLocation became net.minecraft.resources
	// .Identifier, and playNotifySound() became level().playSound(). This tree is
	// the source every other era is generated from; tools/port_eras.py never
	// writes it.
	'v1_21_11' : [mc: '1.21.11', era: '1.21.11', java: 21, api: '0.141.6+1.21.11',  loader: '0.19.3', remap: true],

	// ---- era 26.1: 26.1 (UNOBFUSCATED) ----------------------------------
	// No mappings exist for these versions at all — Fabric's metadata returns an
	// empty list — which is the hard evidence that the game ships with readable
	// names. Java 25. Source-wise 26.1 is the 1.21.11 dialect: Identifier,
	// level().playSound(), and one Items constant per colour.
	'v26_1'    : [mc: '26.1',    era: '26.1',   java: 25, api: '0.155.3+26.1.2',   loader: '0.19.3', remap: false],

	// ---- era 26.2: 26.2 – 26.3 ------------------------------------------
	// 26.2 merged each item's sixteen colour variants into one ColorCollection
	// record, so Items.GREEN_CONCRETE becomes Items.CONCRETE.green() and
	// Items.BLACK_STAINED_GLASS_PANE becomes Items.STAINED_GLASS_PANE.black().
	// The registry ids are unchanged — block.minecraft.green_concrete is still in
	// 26.3's language file — so this is purely a Java-naming split, and it is the
	// only thing separating this tree from era 26.1.
	'v26_2'    : [mc: '26.2',    era: '26.2',   java: 25, api: '0.161.0+26.2',     loader: '0.19.3', remap: false],

	// ---- era 26.3: 26.3 --------------------------------------------------
	// Identical to 26.2 except for one signature: 26.3 gave Player.drop a
	// Prediction argument, so the "inventory was full, drop the remainder" path
	// needs its own tree. See tools/port_eras.py.
	'v26_3'    : [mc: '26.3',    era: '26.3',   java: 25, api: '0.161.0+26.3',     loader: '0.19.3', remap: false],
]
